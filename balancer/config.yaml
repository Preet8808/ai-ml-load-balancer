# AI/ML Load Balancer Configuration
# Edit the algorithm to change routing strategy

algorithm: round_robin  # Options: random, round_robin, weighted_rr, least_conn, weighted_least_conn, least_response_time, ml

# `weight` is the relative capacity used by the weighted algorithms, and
# `cpu_limit` is the capacity the router sees as a feature. Both express the
# 4:2:2:1 design ratio. The quotas actually enforced by Docker are scaled to
# fit this host (0.8 / 0.4 / 0.4 / 0.15, see docker-compose.yml) because a
# quota the machine cannot deliver turns every latency sample into a scheduler
# artefact. The collector publishes this configured value rather than the
# quota each backend reports, so the feature the model was trained on and the
# feature it sees at serving time are the same number.
servers:
  - server_id: backend1
    host: backend1
    port: 8000
    weight: 2.0          # CPU limit proportion
    cpu_limit: 2.0       # Cores
    mem_limit_mb: 512    # Memory in MB

  - server_id: backend2
    host: backend2
    port: 8000
    weight: 1.0
    cpu_limit: 1.0
    mem_limit_mb: 256

  - server_id: backend3
    host: backend3
    port: 8000
    weight: 1.0
    cpu_limit: 1.0
    mem_limit_mb: 512

  - server_id: backend4
    host: backend4
    port: 8000
    weight: 0.5
    cpu_limit: 0.5
    mem_limit_mb: 128

sla_ms: 500              # Service Level Agreement threshold in milliseconds

# Monitoring settings
metrics_poll_interval_s: 1
stale_threshold_s: 3.0   # Metrics older than this are considered stale
health_check_interval_s: 2
health_check_failures_threshold: 3
health_check_success_threshold: 3

# Fallback settings
fallback_to_least_conn: true