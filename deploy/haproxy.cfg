# Reference config: HAProxy as a least-connections L7 proxy over the same four
# backends. This is the second "mature proxy" baseline the plan asks for; it is
# not part of the default compose file and the balancer does not use it.
#
# HAProxy features the comparison is meant to expose:
#   * balance leastconn, the same family as this project's least_conn
#   * active HTTP health checks every 2 s (fall 3 / rise 2), against the
#     backends' /health endpoint
#   * retries 1 on connection failures, but no application-level retry on a
#     5xx from the backend itself
#   * no request log by default, so a comparison has to be measured at the
#     client

global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option http-server-close
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    retries 1

frontend http
    bind :8080
    default_backend backends

backend backends
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 3 rise 2
    server backend1 backend1:8000 check
    server backend2 backend2:8000 check
    server backend3 backend3:8000 check
    server backend4 backend4:8000 check
