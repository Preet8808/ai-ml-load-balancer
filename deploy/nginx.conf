# Reference config: Nginx as a least-connections L7 proxy over the same four
# backends the balancer routes to. This is the "mature proxy" baseline the plan
# asks for - it is not part of the default compose file, and the balancer does
# not use it. See deploy/README.md for how to start it next to the stack.
#
# What it does and does not have, compared with this project's proxy:
#   * least_conn over active connections, the standard Nginx load-balancing
#     method; no prediction and no request-cost awareness
#   * passive health checks (max_fails/fail_timeout); no circuit breaker and no
#     slow start, and a failed request is not retried elsewhere by default
#   * no request log, so a comparison has to be measured at the client

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;
    # Keep upstream connections alive: without this, every proxied request
    # pays a new TCP connection to the backend and the baseline looks worse
    # than a mature Nginx deployment actually is.
    upstream backends {
        least_conn;
        server backend1:8000 max_fails=2 fail_timeout=5s;
        server backend2:8000 max_fails=2 fail_timeout=5s;
        server backend3:8000 max_fails=2 fail_timeout=5s;
        server backend4:8000 max_fails=2 fail_timeout=5s;
        keepalive 128;
    }

    server {
        listen 8080;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://backends;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }
    }
}
