# Optional reference proxies over the same backends. Not part of the default
# stack: `docker compose -f docker-compose.yml -f deploy/compose.reference.yml up -d`
#
# Both services must join `balancer-net`: the backends are only on that
# network, so a service on the default network cannot resolve `backend1` and
# Nginx refuses to start ("host not found in upstream").
services:
  nginx:
    image: nginx:1.27-alpine
    cpus: "0.5"
    mem_limit: "64m"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
      - backend4
    networks:
      - balancer-net

  haproxy:
    image: haproxy:2.9-alpine
    cpus: "0.5"
    mem_limit: "64m"
    ports:
      - "8082:8080"
    volumes:
      - ./deploy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - backend1
      - backend2
      - backend3
      - backend4
    networks:
      - balancer-net
