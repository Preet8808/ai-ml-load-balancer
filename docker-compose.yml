services:
  balancer:
    build:
      context: .
      dockerfile: Dockerfile.balancer
    ports:
      - "9090:8080"
    # The host is 2 physical cores / 4 threads and Docker exposes all 4 as
    # vCPU. Every quota below is a share of that 4-vCPU budget, and the sum has
    # to leave room for the OS, the Docker VM and the load generator. When the
    # quotas summed above the machine's capacity, every latency sample was set
    # by scheduler contention rather than by any server's own state, which is
    # precisely the signal the dataset is supposed to contain.
    cpus: "2.0"
    mem_limit: "512m"
    depends_on:
      - backend1
      - backend2
      - backend3
      - backend4
    environment:
      - ALGORITHM=round_robin
    volumes:
      - ./logs:/app/logs
      # Decision log: written on the same run lifecycle as the request log, so
      # it is mounted the same way. Kept out of the image for the same reason
      # as logs - it is output, not source.
      - ./decisions:/app/decisions
      # Live code, so a router change does not need an image rebuild. A rebuild
      # installs every wheel with --no-cache-dir, which on a slow connection
      # takes tens of minutes, and no measurement should have to wait for that.
      # Read-only, so the container can never write back into the source tree.
      - ./balancer:/app/balancer:ro
      - ./ml:/app/ml:ro
      # The trained artifact is mounted rather than baked in: the model is a
      # build output, and copying a new one into an image would mean a full
      # rebuild every time the model is retrained.
      - ./models:/app/models:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - balancer-net

  # Backend quotas keep the 4:2:2:1 ratio that makes the cluster heterogeneous
  # (and that cpu_limit exposes as a routing feature) while summing to 1.75
  # vCPU instead of 4.5. A pipeline of overlapped work still needs headroom for
  # 2.0 (balancer) + 1.75 (backends) + 0.5 (generator) = 4.25 vCPU across
  # partially idle services; the quotas are ceilings, not demand.
  backend1:
    build:
      context: .
      dockerfile: Dockerfile.backend
    cpus: "0.8"
    mem_limit: "512m"
    environment:
      - BACKEND_ID=1
      - BACKEND_CPUS=0.8
      - BACKEND_MEM=512
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - balancer-net

  backend2:
    build:
      context: .
      dockerfile: Dockerfile.backend
    cpus: "0.4"
    mem_limit: "256m"
    environment:
      - BACKEND_ID=2
      - BACKEND_CPUS=0.4
      - BACKEND_MEM=256
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - balancer-net

  backend3:
    build:
      context: .
      dockerfile: Dockerfile.backend
    cpus: "0.4"
    mem_limit: "512m"
    environment:
      - BACKEND_ID=3
      - BACKEND_CPUS=0.4
      - BACKEND_MEM=512
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - balancer-net

  backend4:
    build:
      context: .
      dockerfile: Dockerfile.backend
    cpus: "0.15"
    mem_limit: "128m"
    environment:
      - BACKEND_ID=4
      - BACKEND_CPUS=0.15
      - BACKEND_MEM=128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - balancer-net

networks:
  balancer-net:
    driver: bridge