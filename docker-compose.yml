services:
  balancer:
    build:
      context: .
      dockerfile: Dockerfile.balancer
    ports:
      - "9090:8080"
    depends_on:
      - backend1
      - backend2
      - backend3
      - backend4
    environment:
      - ALGORITHM=round_robin
    volumes:
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - balancer-net

  backend1:
    build:
      context: .
      dockerfile: Dockerfile.backend
    cpus: "2.0"
    mem_limit: "512m"
    environment:
      - BACKEND_ID=1
      - BACKEND_CPUS=2.0
      - BACKEND_MEM=512
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - balancer-net

  backend2:
    build:
      context: .
      dockerfile: Dockerfile.backend
    cpus: "1.0"
    mem_limit: "256m"
    environment:
      - BACKEND_ID=2
      - BACKEND_CPUS=1.0
      - BACKEND_MEM=256
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - balancer-net

  backend3:
    build:
      context: .
      dockerfile: Dockerfile.backend
    cpus: "1.0"
    mem_limit: "512m"
    environment:
      - BACKEND_ID=3
      - BACKEND_CPUS=1.0
      - BACKEND_MEM=512
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - balancer-net

  backend4:
    build:
      context: .
      dockerfile: Dockerfile.backend
    cpus: "0.5"
    mem_limit: "128m"
    environment:
      - BACKEND_ID=4
      - BACKEND_CPUS=0.5
      - BACKEND_MEM=128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - balancer-net

networks:
  balancer-net:
    driver: bridge